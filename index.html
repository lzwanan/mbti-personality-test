<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBTI 性格测试</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{background:white;border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,0.25);max-width:720px;width:100%;margin:0 auto;overflow:hidden}.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:32px;text-align:center}.header h1{font-size:32px;margin-bottom:8px}.header p{opacity:0.9;font-size:14px}.content{padding:32px}.progress-section{margin-bottom:30px}.progress-info{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:#666}.progress-info span{font-weight:500}.progress-info .completed{color:#667eea}.progress-info .remaining{color:#ff6b6b}.progress-bar{background:#f0f0f0;border-radius:12px;height:12px;overflow:hidden}.progress-fill{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);height:100%;transition:width 0.3s ease;border-radius:12px}.question{margin-bottom:30px}.question-text{font-size:22px;color:#333;margin-bottom:28px;line-height:1.7;font-weight:600}.options{display:flex;flex-direction:column;gap:16px}.option{padding:20px 28px;border:2px solid #e8e8e8;border-radius:14px;cursor:pointer;transition:all 0.3s ease;font-size:16px;color:#555}.option:hover{border-color:#667eea;background:#f8f9ff;transform:translateX(8px)}.option.selected{border-color:#667eea;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;transform:translateX(8px)}.buttons{display:flex;gap:16px;margin-top:32px}.btn{flex:1;padding:16px;border:none;border-radius:12px;font-size:16px;cursor:pointer;transition:all 0.3s ease;font-weight:600}.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}.btn-primary:hover:not(:disabled){transform:translateY(-3px)}.btn-secondary{background:#f0f0f0;color:#666}.btn-secondary:hover{background:#e8e8e8}.btn:disabled{opacity:0.5;cursor:not-allowed}.result{text-align:center}.result-avatar{font-size:120px;margin-bottom:15px;display:block}.result-type{font-size:72px;font-weight:800;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:4px}.result-name{font-size:32px;color:#333;margin-bottom:12px;font-weight:700}.result-desc{color:#666;line-height:1.8;margin-bottom:24px;font-size:16px}.result-details{background:#f8f9ff;padding:24px;border-radius与其他 16px;margin-bottom:24px;text-align:left;border:2px solid #e8ecff}.detail-item{margin-bottom:18px;padding-bottom:18px;border-bottom:1px dashed #ddd}.detail-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}.detail-label{font-weight:700;color:#667eea;margin-bottom:6px;font-size:15px}.detail-text{color:#555;line-height:1.7;font-size:14px}.dimensions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.dimension{background:#f8f9ff;padding:20px;border-radius:14px;text-align:center;border:2px solid #e8ecff}.dimension-label{font-size:13px;color:#888;margin-bottom:8px;font-weight:500}.dimension-value{font-size:32px;font-weight:800;color:#667eea}.dimension-score{font-size:12px;color:#999;margin-top:6px}.start-screen{text-align:center;padding:40px 30px}.start-icon{font-size:100px;margin-bottom:20px}.start-title{font-size:28px;color:#333;margin-bottom:16px;font-weight:700}.start-desc{color:#666;line-height:1.8;margin-bottom:32px;font-size:15px}.mode-selection{display:flex;gap:16px;margin-bottom:32px}.mode-btn{flex:1;padding:24px 20px;border:3px solid #e8e8e8;border-radius:16px;background:white;cursor:pointer;transition:all 0.3s ease}.mode-btn:hover{border-color:#667eea;background:#f8f9ff;transform:translateY(-4px)}.mode-btn.selected{border-color:#667eea;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;transform:translateY(-4px)}.mode-icon{font-size:48px;margin-bottom:12px;display:block}.mode-title{font-size:20px;font-weight:700;margin-bottom:6px}.mode-desc{font-size:14px;opacity:0.8}.mode-btn.selected .mode-title,.mode-btn.selected .mode-desc{color:white}.start-btn{width:100%;padding:20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:14px;font-size:20px;cursor:pointer;transition:all 0.3s ease;font-weight:700}.start-btn:hover{transform:translateY(-4px)}.personality-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:32px}.personality-card{background:#fafafa;padding:18px;border-radius:16px;text-align:center;border:2px solid #e8e8e8;cursor:pointer;transition:all 0.3s ease}.personality-card:hover{border-color:#667eea;transform:translateY(-6px)}.card-avatar{font-size:48px;margin-bottom:8px;display:block}.card-type{font-size:28px;font-weight:800;color:#667eea;margin-bottom:4px;letter-spacing:2px}.card-name{font-size:15px;color:#333;font-weight:600;margin-bottom:6px}.card-desc{font-size:13px;color:#666;line-height:1.4}.section-title{font-size:22px;color:#333;text-align:center;margin:36px 0 24px;font-weight:700}.hidden{display:none}</style></head><body><div class="container"><div class="header"><h1>🧠 MBTI 性格测试</h1><p>发现你独特的性格密码</p></div><div class="content"><div id="start-screen" class="start-screen"><div class="start-icon">🎭</div><h2 class="start-title">探索你的性格密码</h2><p class="start-desc">MBTI是全球最受欢迎的性格评估工具，通过4个维度揭示你独特的人格类型。<br><br>✨ 16种人格类型<br>🎯 精确算法，专业解读</p><div class="mode-selection"><div class="mode-btn" id="mode-quick" onclick="selectMode('quick')"><span class="mode-icon">⚡</span><div class="mode-title">快速测试</div><div class="mode-desc">16道题 • 约3分钟</div></div><div class="mode-btn selected" id="mode-full" onclick="selectMode('full')"><span class="mode-icon">🎯</span><div class="mode-title">精确测试</div><div class="mode-desc">48道题 • 约8分钟</div></div></div><button class="start-btn" onclick="startTest()">开始测试</button><div class="section-title">✨ 16型人格一览</div><div class="personality-grid" id="personality-grid"></div></div><div id="test-screen" class="hidden"><div class="progress-section"><div class="progress-info"><span class="completed">已完成: <span id="completed-count">0</span> 题</span><span class="remaining">剩余: <span id="remaining-count">0</span> 题</span></div><div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div></div><div class="question"><p class="question-text" id="question-text"></p><div class="options" id="options"></div></div><div class="buttons"><button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()">⬅️ 上一题</button><button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">下一题 ➡️</button></div></div><div id="result-screen" class="result hidden"><span class="result-avatar" id="result-avatar"></span><div class="result-type" id="result-type"></div><h3 class="result-name" id="result-name"></h3><p class="result-desc" id="result-desc"></p><div class="result-details" id="result-details"></div><div class="dimensions" id="dimensions"></div><div class="buttons"><button class="btn btn-secondary" onclick="restartTest()">🔄 重新测试</button><button class="btn btn-primary" onclick="goBackToStart()">🏠 返回首页</button></div></div></div></div><script src="mbti.js"></script></body></html>
